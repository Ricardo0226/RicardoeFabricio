<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda do Laboratório - Teste</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .navbar h1 {
        text-align: center;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 10px;
        text-align: center;
        height: 50px;
      }
      th {
        background-color: #f2f2f2;
      }
      .horario-livre {
        background-color: #e6ffe6;
      }
      .horario-ocupado {
        background-color: #ffe6e6;
        font-weight: bold;
      }
      .horario-label {
        font-weight: bold;
        background-color: #f9f9f9;
      }
    </style>
  </head>

  <body>
    <header>
      <nav class="navbar">
        <h1 id="lab-title"></h1>
      </nav>
    </header>

    <main>
      <div style="margin-bottom: 20px;">
        <a href="/menu" style="display: inline-block; padding: 8px 12px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 4px;">← Voltar ao Menu</a>
      </div>
      <div id="lab-info" style="margin-bottom: 20px;">
        <h2 id="lab-status"></h2>
      </div>
      <table id="tabela-agenda">
        <thead>
          <tr>
            <th>Horário</th>
            <th>Segunda</th>
            <th>Terça</th>
            <th>Quarta</th>
            <th>Quinta</th>
            <th>Sexta</th>
          </tr>
        </thead>
        <tbody>
          
        </tbody>
      </table>
    </main>

    <script>
      const diasSemana = {
        1: "Segunda",
        2: "Terça",
        3: "Quarta",
        4: "Quinta",
        5: "Sexta",
      };

      const horarios = {
        1: "07:00 - 07:45",
        2: "07:45 - 08:30",
        3: "08:50 - 09:35",
        4: "09:35 - 10:20",
        5: "10:30 - 11:15",
        6: "11:15 - 12:00",
        7: "13:00 - 13:45",
        8: "13:45 - 14:30",
        9: "14:40 - 15:35",
        10: "15:35 - 16:20",
        11: "16:30 - 17:15",
        12: "17:15 - 18:00",
      };

      $(function () {
        const tbody = $("#tabela-agenda tbody");
        const urlParams = new URLSearchParams(window.location.search);
        const labIdParam = urlParams.get('lab_id');
        for (let h = 1; h <= 12; h++) {
          let row = `<tr><td class="horario-label">${horarios[h]}</td>`;
          for (let d = 1; d <= 5; d++) {
            row += `<td id="cell-${d}-${h}" class="agenda-cell" data-dia="${d}" data-horario="${h}"></td>`;
          }
          row += "</tr>";
          tbody.append(row);
        }

        if (labIdParam) {
          $("#lab-title").text(`Agenda Semanal do Laboratório ${labIdParam}`);
          carregarAgenda(labIdParam);
        }

        $("#lab-select").on("change", function () {
          const labNumero = $(this).val();
          if (labNumero && labNumero !== "none") {
            carregarAgenda(labNumero);
          } else {
            limparAgenda();
          }
        });

        async function carregarAgenda(labNumero) {
          limparAgenda(); 

          try {
            const response = await fetch(`/api/agendamentos/${labNumero}`);
            if (!response.ok)
              throw new Error("Erro ao buscar a agenda do laboratório.");

            const agendamentos = await response.json();

            $(".agenda-cell").addClass("horario-livre").text("Livre");

            agendamentos.forEach((a) => {
              const cell = $(`#cell-${a.dia}-${a.horario}`);
              cell
                .removeClass("horario-livre")
                .addClass("horario-ocupado")
                .html(`<strong>${a.disciplina}</strong><br>Prof. ${a.professor || 'N/A'}`);
            });

            // parte do status
            try {
              const statusResp = await fetch(`/api/lab/${labNumero}/status`);
              if (statusResp.ok) {
                const statusJson = await statusResp.json();
                $("#lab-status").text(`Status do Laboratório: ${statusJson.status || 'aberto'}`);
              } else {
                $("#lab-status").text('Status do Laboratório: desconhecido');
              }
            } catch (err2) {
              console.error('Erro ao buscar status:', err2);
              $("#lab-status").text('Status do Laboratório: erro');
            }

          } catch (error) {
            console.error("Falha ao carregar a agenda:", error);
            alert("Erro ao carregar a agenda. Verifique o console para detalhes.");
          }
        }

        function limparAgenda() {
          $(".agenda-cell")
            .removeClass("horario-ocupado")
            .removeClass("horario-livre")
            .empty();
        }
      });
    </script>
  </body>
</html>
