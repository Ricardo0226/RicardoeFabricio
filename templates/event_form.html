{% extends "base.html" %}
{% block title %}{{ form_title }} — ClassSync{% endblock %}
{% block content %}
<section class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-body p-4 p-md-5">
        <p class="text-primary text-uppercase fw-semibold small mb-2">Sprint 2.4</p>
        <h1 class="h3 fw-bold">{{ form_title }}</h1>
        <p class="text-secondary">Preencha os dados do compromisso que será exibido no calendário.</p>
        <form method="post" novalidate>
          <div class="mb-3">
            <label class="form-label" for="title">Título</label>
            <input class="form-control" id="title" name="title" maxlength="160" required value="{{ form_data.get('title', event.title if event else '') }}">
          </div>
          <div class="mb-3">
            <label class="form-label" for="description">Descrição</label>
            <textarea class="form-control" id="description" name="description" rows="4">{{ form_data.get('description', event.description if event else '') }}</textarea>
          </div>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label" for="start_at">Início</label>
              <input class="form-control" id="start_at" name="start_at" type="datetime-local" required value="{{ form_data.get('start_at', event.start_at.strftime('%Y-%m-%dT%H:%M') if event else '') }}">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="end_at">Término</label>
              <input class="form-control" id="end_at" name="end_at" type="datetime-local" value="{{ form_data.get('end_at', event.end_at.strftime('%Y-%m-%dT%H:%M') if event else '') }}">
            </div>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Salvar compromisso</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('admin') }}">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
