<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LabAgenda - Banco de Dados</title>
    <link
      rel="stylesheet"
      href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>
  </head>

  <body>
    <header>
      <nav class="navbar">
        <h1>LabAgenda - Banco de Dados</h1>
        <a class="btn" href="{{ url_for('menu') }}">INÍCIO</a>
      </nav>
    </header>

    <main>
      <section class="conteiner">
        <section class="esquerda">
          <div class="professores">
            <form>
              <fieldset>
                <label for="filesA">Professores</label>
                <select name="filesA" id="filesA">
                  <option value="none"></option>
                  {% for prof in professores %}
                  <option value="{{ prof.matricula }}">{{ prof.nome }}</option>
                  {% endfor %}
                </select>
              </fieldset>
            </form>
          </div>

          <div class="card">
            <h2>
              DISCIPLINAS -
              <span id="professor-selecionado">Professor</span>
            </h2>
            <div id="disciplinas-container"></div>
          </div>
        </section>

        <section class="direita">
          <div class="labs">
            <form>
              <fieldset>
                <label for="filesB">Laboratórios</label>
                <select name="filesB" id="filesB">
                  <option value="none"></option>
                  {% for lab in laboratorios %}
                  <option value="{{ lab.numero }}" >
                    {{ lab.numero }} | {{ lab.descriçao }}
                  </option>
                  {% endfor %}
                </select>
              </fieldset>
            </form>
          </div>

          <div class="lab-status-control">
            <label for="lab-status-select">Status do laboratório</label>
            <select id="lab-status-select">
              <option value="aberto">aberto</option>
              <option value="fechado">fechado</option>
              <option value="manutenção">manutenção</option>
            </select>
            <button id="btn-alterar-status" type="button">Alterar Status</button>
            <div id="status-msg" style="margin-top:8px;color:#333"></div>
          </div>

          <div class="agenda">
            <table style="width: 100%" border="1" id="tabela-agenda">
              <thead>
                <tr>
                  <th>Segunda</th>
                  <th>Terça</th>
                  <th>Quarta</th>
                  <th>Quinta</th>
                  <th>Sexta</th>
                </tr>
              </thead>
              <tbody>
                <script src="{{ url_for('static', filename='scripts/blocos.js') }}"></script>
              </tbody>
            </table>
          </div>

          <button id="limpar-agenda" type="button">
            Limpar Agenda do Laboratório
          </button>

          <button id="salvar-agenda" type="button">SALVAR</button>

          <script src="{{ url_for('static', filename='scripts/saves.js') }}"></script>
        <script>
          $(function(){
            function atualizarSelectStatus(){
              var selected = $('#filesB').find(':selected');
              var status = selected.data('status') || 'aberto';
              $('#lab-status-select').val(status);
            }

            $('#filesB').on('change', function(){
              atualizarSelectStatus();
            });

            // set initial
            atualizarSelectStatus();

            $('#btn-alterar-status').on('click', function(){
              var lab = $('#filesB').val();
              if(!lab || lab === 'none'){
                $('#status-msg').text('Selecione um laboratório primeiro.');
                return;
              }
              var novoStatus = $('#lab-status-select').val();
              fetch('/api/lab/' + encodeURIComponent(lab) + '/status', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({status: novoStatus})
              }).then(function(resp){
                if(resp.ok) return resp.json();
                return resp.json().then(function(j){throw j});
              }).then(function(data){
                $('#status-msg').text('Status atualizado.');
                // atualizar texto e data-status no option selecionado
                var opt = $('#filesB').find('option[value="'+lab+'"]');
                opt.attr('data-status', novoStatus);
                opt.text(opt.text().replace(/(— ).*$/, '— ' + novoStatus));
              }).catch(function(err){
                $('#status-msg').text('Erro: ' + (err.message || JSON.stringify(err)));
              });
            });
          });
        </script>
        </section>
      </section>
    </main>
  </body>
</html>
